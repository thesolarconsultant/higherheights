<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{background:#0B1A26;color:#F4EFE6;font-family:"Instrument Sans",system-ui,sans-serif;
       display:grid;grid-template-rows:1fr auto;padding:62px 68px 54px;box-sizing:border-box;
       background-image:radial-gradient(120% 90% at 78% 8%, rgba(201,174,124,.10), transparent 62%),
                        linear-gradient(180deg, #0E2130 0%, #0B1A26 68%);}
  .mid{align-self:center;display:flex;flex-direction:column;gap:30px}
  .rule{width:74px;height:1px;background:#C9AE7C;opacity:.65}
  img.wm{width:720px;display:block}
  .sub{display:flex;gap:26px;align-items:baseline}
  .sub span{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:rgba(244,239,230,.62)}
  .sub b{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:#C9AE7C;font-weight:500}
  .foot{display:flex;justify-content:space-between;align-items:center;
        border-top:1px solid rgba(201,174,124,.22);padding-top:22px}
  .foot span{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:rgba(244,239,230,.5)}
  .foot .seal{width:64px;height:64px}
</style></head><body>
  <div class="mid">
    <div class="rule"></div>
    <img class="wm" src="logos/wm-full-cream.svg" alt="Higher Heights Films">
    <div class="sub"><b>Film</b><span>Aerial</span><span>Photography</span></div>
  </div>
  <div class="foot">
    <span>London · worldwide</span>
    <img class="seal" src="logos/seal-gold.svg" alt="">
  </div>
</body></html>
