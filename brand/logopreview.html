<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  body{margin:0;background:#0B1A26;font:11px "Instrument Sans",system-ui,sans-serif;color:#F4EFE6}
  .row{display:grid;grid-template-columns:1fr 1fr}
  .c{padding:26px 34px;display:flex;flex-direction:column;gap:16px;justify-content:center;min-height:120px}
  .navy{background:#0B1A26}.cream{background:#F4EFE6;color:#0B1A26}
  .lab{font-size:9px;letter-spacing:.18em;text-transform:uppercase;opacity:.5}
  img{display:block}
  .sizes{display:flex;gap:26px;align-items:center}
</style></head><body>
<div class="row">
  <div class="c navy"><span class="lab">wordmark full · gold on navy</span><img style="width:760px" src="logos/wm-full-gold.svg"></div>
  <div class="c cream"><span class="lab">wordmark full · navy on cream</span><img style="width:760px" src="logos/wm-full-navy.svg"></div>
</div>
<div class="row">
  <div class="c navy"><span class="lab">caps line only · gold</span><img style="width:600px" src="logos/wm-caps-gold.svg"></div>
  <div class="c cream"><span class="lab">caps line only · navy</span><img style="width:600px" src="logos/wm-caps-navy.svg"></div>
</div>
<div class="row">
  <div class="c navy"><span class="lab">seal · gold</span><div class="sizes"><img style="width:300px" src="logos/seal-gold.svg"><img style="width:120px" src="logos/seal-gold.svg"><img style="width:64px" src="logos/seal-gold.svg"></div></div>
  <div class="c cream"><span class="lab">seal · navy</span><div class="sizes"><img style="width:300px" src="logos/seal-navy.svg"><img style="width:120px" src="logos/seal-navy.svg"><img style="width:64px" src="logos/seal-navy.svg"></div></div>
</div>
<div class="row">
  <div class="c navy"><span class="lab">HH mark extracted · gold</span><div class="sizes"><img style="width:200px" src="logos/seal-mark-gold.svg"><img style="width:60px" src="logos/seal-mark-gold.svg"><img style="width:32px" src="logos/seal-mark-gold.svg"><img style="width:18px" src="logos/seal-mark-gold.svg"></div></div>
  <div class="c cream"><span class="lab">HH mark extracted · navy</span><div class="sizes"><img style="width:200px" src="logos/seal-mark-navy.svg"><img style="width:60px" src="logos/seal-mark-navy.svg"><img style="width:32px" src="logos/seal-mark-navy.svg"><img style="width:18px" src="logos/seal-mark-navy.svg"></div></div>
</div>
<div class="row">
  <div class="c navy"><span class="lab">nav scale test · 26px tall</span><div class="sizes"><img style="height:26px" src="logos/wm-caps-cream.svg"><img style="height:26px" src="logos/seal-mark-gold.svg"><img style="height:26px" src="logos/seal-gold.svg"><img style="height:26px" src="logos/wm-full-cream.svg"></div></div>
  <div class="c cream"><span class="lab">png masters (no vector) · 64px</span><div class="sizes"><img style="height:64px" src="logos/seal-mark-navy.png"><img style="height:64px" src="logos/wm-caps-navy.png"></div></div>
</div>
</body></html>
