<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  body{margin:0;background:#0B1A26;font:12px/1.5 "Instrument Sans",-apple-system,sans-serif;color:#F4EFE6;
       font-family:"Instrument Sans",-apple-system,"Segoe UI",sans-serif}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:3px}
  .cell{position:relative;display:flex;flex-direction:column}
  .cell img{display:block;width:100%}
  .tag{padding:12px 16px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;
       background:#0B1A26;color:#C9AE7C;border-bottom:1px solid rgba(201,174,124,.18)}
  .tag small{display:block;letter-spacing:.06em;text-transform:none;color:rgba(244,239,230,.55);font-size:10.5px;margin-top:2px}
  .bar{padding:14px 18px;display:flex;justify-content:space-between;border-top:1px solid rgba(201,174,124,.25)}
  .bar span{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(244,239,230,.55)}
</style></head><body>
<div class="row">
  <div class="cell"><div class="tag">Before<small>Geist 300 · mountain mark · tracked caps</small></div><img src="../qa/live-hero.png"></div>
  <div class="cell"><div class="tag">After<small>Your wordmark + HH · Bodoni Moda · same footage</small></div><img src="../qa/v4-hero.png"></div>
</div>
<div class="bar"><span>Higher Heights — supplied identity applied</span><span>Same copy · same media</span></div>
</body></html>
