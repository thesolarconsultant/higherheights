<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{background:#0B1A26;color:#F4EFE6;font-family:"Instrument Sans",system-ui,sans-serif;
       display:grid;grid-template-columns:1fr 300px;align-items:center;
       padding:64px 72px;box-sizing:border-box;column-gap:20px;
       background-image:radial-gradient(120% 90% at 82% 10%, rgba(201,174,124,.10), transparent 62%);}
  .left{display:flex;flex-direction:column;gap:26px}
  .rule{width:70px;height:1px;background:#C9AE7C;opacity:.65}
  img.wm{width:700px;display:block}
  .sub{display:flex;gap:22px;font-size:12.5px;letter-spacing:.22em;text-transform:uppercase;color:rgba(244,239,230,.6)}
  .sub b{color:#C9AE7C;font-weight:500}
  .right{display:flex;justify-content:flex-end;align-items:center}
  img.hh{width:250px;display:block}
  .foot{position:absolute;left:72px;right:72px;bottom:44px;display:flex;justify-content:space-between;
        border-top:1px solid rgba(201,174,124,.22);padding-top:18px;font-size:11.5px;
        letter-spacing:.2em;text-transform:uppercase;color:rgba(244,239,230,.5)}
</style></head><body>
  <div class="left">
    <div class="rule"></div>
    <img class="wm" src="logos2/wordmark-cream.svg" alt="Higher Heights Films">
    <div class="sub"><b>Film</b><span>Aerial</span><span>Photography</span></div>
  </div>
  <div class="right"><img class="hh" src="logos2/hh-flat-gold.svg" alt=""></div>
  <div class="foot"><span>London</span><span>Filming worldwide</span></div>
</body></html>
